name: Platform CI

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  push:
    branches:
      - feature/auth-platform-sprint-01
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
